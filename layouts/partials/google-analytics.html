{{ with .Site.Params }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ .googleTagManagerId }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', '{{ .googleTagManagerId }}');
</script>
{{ end }}
